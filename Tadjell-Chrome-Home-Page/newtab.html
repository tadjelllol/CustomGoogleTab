<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.ico">
  <script src="wallpapers.js" defer></script>
  <script src="bookmarks.js" defer></script>
  <script src="newtab.js" defer></script>
</head>
<body>
  <div class="wallpapers" aria-hidden="true">
    <div class="wallpaper is-current"></div>
    <div class="wallpaper"></div>
  </div>
  <div class="contrast-overlay" aria-hidden="true"></div>
  <main>
    <time class="time" id="clock" aria-label="Current time"></time>
    <form id="search-form" role="search" action="https://www.google.com/search">
      <label class="sr-only" for="search">Search Google</label>
      <input type="search" name="q" id="search" class="search-box" placeholder="Search Google" autocomplete="off" spellcheck="false">
    </form>
    <section class="shortcuts" aria-label="Bookmarks">
      <div id="group-selector" class="group-selector" role="tablist" aria-label="Bookmark groups"></div>
      <div id="bookmark-panels"></div>
    </section>
    <noscript>Enable JavaScript to show the clock and bookmarks.</noscript>
  </main>
</body>
</html>
